<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - web player: Music for everyone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="container flex bg-black">

        <div class="left">

            <div class="close">
                <img class="invert" width="30" src="close.svg" alt="">
            </div>

            <div class="home bg-gray rounded m-1 p-1">
                <ul>
                    <div class="logo"><img height="38px" src="Spotify_icon.svg.webp" alt=""></div>
                    <li><img src="home.svg" alt="home">Home</li>
                    <li><img class="invert" src="search.svg" alt="Search">Search</li>
                </ul>
            </div>
            <div class="library bg-gray rounded m-1 p-1">

                <div class="heading"><img class="invert" src="download................png" alt="">
                    <h2>
                        Your Library
                    </h2>

                </div>
                <div class="songlist">
                    <ul>

                    </ul>
                </div>


                <div class="footer">
                    <div>
                        <a href="https://www.spotify.com/in/legal/">
                            <span>Legal</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/in/privacy/">
                            <span>Privacy Center</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/in/legal/privacy-policy/">
                            <span>Privacy Policy</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/in/legal/cookies-policy/">
                            <span>Cookies</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/in/legal/privacy-policy/#s3">
                            <span>About Ads</span>
                        </a>
                    </div>

                    <div>
                        <a href="https://www.spotify.com/in/accessibility/">
                            <span>Accessibility</span>
                        </a>
                    </div>
                </div>

            </div>

        </div>

        <div class="right bg-gray rounded">

            <div class="header">

                <div class="nav">

                    <div class="hamburgerContainer">
                        <img width="40" class="invert hamburger" src="hamburger.svg" alt="">

                        <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="1.5" d="M15 6s-6 4.419-6 6s6 6 6 6" color="currentColor" />
                        </svg>

                        <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24">
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="1.5" d="M9 6s6 4.419 6 6s-6 6-6 6" color="currentColor" />
                        </svg>

                    </div>
                </div>
                <div class="buttons">
                    <button class="signupbtn">Sign up</button>
                    <button class="loginbtn">Login</button>

                </div>
            </div>
            <div class="spotifyPlaylist">
                <h1>spotify-playlist</h1>
                <div class="cardContainer">
                    <div data-folder="cs"  class="card">

                        <div class="play">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                <circle cx="12" cy="12" r="12" fill="#1DB954" />
                                <path d="M9 7.5L17 12L9 16.5V7.5Z" fill="#000" />
                            </svg>
                        </div>

                        <img src="songs/cs/cover.jpg" alt="">
                        <h2>Can't Help Falling in Love</h2>
                        <p>With These Songs
                        </p>
                    </div>
                    <div data-folder="ncs"  class="card">

                        <div class="play">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                <circle cx="12" cy="12" r="12" fill="#1DB954" />
                                <path d="M9 7.5L17 12L9 16.5V7.5Z" fill="#000" />
                            </svg>
                        </div>

                        <img src="songs/ncs/cover.jpg" alt="">
                        <h2>Can't Help Falling in Love</h2>
                        <p>With these songs
                        </p>
                    </div>
                    <div data-folder="arjit"  class="card">

                        <div class="play">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                <circle cx="12" cy="12" r="12" fill="#1DB954" />
                                <path d="M9 7.5L17 12L9 16.5V7.5Z" fill="#000" />
                            </svg>
                        </div>

                        <img src="songs/arjit/ariii.jpg" alt="">
                        <h2>The Arijit Singh Collection</h2>
                        <p>Arijit Singh
                        </p>
                    </div>
                     
                     
                    <div data-folder="karan"  class="card">

                        <div class="play">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                                <circle cx="12" cy="12" r="12" fill="#1DB954" />
                                <path d="M9 7.5L17 12L9 16.5V7.5Z" fill="#000" />
                            </svg>
                        </div>

                        <img src="songs/karan/karan.webp" alt="">
                        <h2>Karan Aujla Mix</h2>
                        <p>Made for you
                        </p>
                    </div>
                     
                     
                    
                   



                    <div class="play">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
                            <circle cx="12" cy="12" r="12" fill="#1DB954" />
                            <path d="M9 7.5L17 12L9 16.5V7.5Z" fill="#000" />
                        </svg>
                    </div>

                </div>





            </div>

            <div class="playbar">

                <div class="seekbar">
                    <div class="circle"></div>
                </div>


                <div class="abovebar">
                    <div class="songinfo">
                        +
                    </div>
                    <div class="songbutton">
                        <img width="35" id="previous" class="invert" src="priviousSong.svg" alt="">
                        <img width="35" id="play" class="invert" src="pause.svg" alt="">
                        <img width="35" id="next" class="invert" src="NextSong.svg" alt="">
                    </div>
                    <div class="timevol">

                        <div class="songtime">

                    </div>

                    <div class="volume">
                        <img width="25px" src="volume.svg" alt="">
                        
                        <div class="range">
                            <input type="range" name="volume" min="0" max="100" value="50">
                        </div>
                    </div>

                    </div>
                    

                </div>
            </div>
        </div>
    </div>

    </div>

    <script src="sc.js"></script>
</body>

</html>
